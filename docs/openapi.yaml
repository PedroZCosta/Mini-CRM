openapi: 3.0.3
info:
  title: Mini CRM (PJBL) — API mock
  version: "1.0.0"
  description: |
    API de dados mock do Mini CRM, implementada em Azure Functions (Node v4) e
    publicada junto do front no Azure Static Web Apps, sob o caminho `/api`.

    As funções são sem estado: as operações de escrita **validam** a entrada e
    devolvem o registro resultante, mas não gravam em banco. O front-end guarda
    o resultado em `localStorage`.

    O parâmetro `usuarioId` define o escopo dos dados (RF15): Vendedor recebe a
    própria carteira, Gerente a da equipe e Administrador o conjunto completo.

    Este arquivo existe para importar a API no Apidog e gerar o mock a partir
    dos mesmos contratos usados em produção.
servers:
  - url: https://ambitious-pebble-077133f10.7.azurestaticapps.net/api
    description: Produção (Azure Static Web Apps)
  - url: http://localhost:7071/api
    description: Servidor local de desenvolvimento

tags:
  - name: Saúde
  - name: Usuários
  - name: Clientes
  - name: Interações
  - name: Oportunidades
  - name: Tarefas
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Saúde]
      summary: Estado da API e tamanho da massa mock
      operationId: health
      responses:
        "200":
          description: API no ar
          content:
            application/json:
              example:
                status: ok
                api: Mini CRM (PJBL) — dados mock
                referencia: 2026-08-31
                registros:
                  usuarios: 8
                  clientes: 46
                  interacoes: 123
                  oportunidades: 60
                  tarefas: 22
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  api: { type: string, example: "Mini CRM (PJBL) — dados mock" }
                  referencia: { type: string, format: date, example: "2026-08-31" }
                  registros:
                    type: object
                    properties:
                      usuarios: { type: integer, example: 8 }
                      clientes: { type: integer, example: 46 }
                      interacoes: { type: integer, example: 123 }
                      oportunidades: { type: integer, example: 60 }
                      tarefas: { type: integer, example: 22 }

  /usuarios:
    get:
      tags: [Usuários]
      summary: Usuários do sistema, sem credenciais
      operationId: listarUsuarios
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              example:
                itens:
                  - id: u3
                    nome: Rui Alves
                    email: rui@empresa.com
                    perfil: Admin
                    status: Ativo
                    gerenteId: null
                    modoVisualizacao: Total
                    seed: true
                  - id: u1
                    nome: Ana Costa
                    email: ana@empresa.com
                    perfil: Gerente
                    status: Ativo
                    gerenteId: null
                    modoVisualizacao: Equipe
                total: 8
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Usuario" }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores, funil resumido, tarefas e ranking
      operationId: dashboard
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Indicadores no escopo do usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaDashboard" }
              example:
                escopo:
                  usuarioId: u1
                  nome: Ana Costa
                  perfil: Gerente
                  modoVisualizacao: Equipe
                  responsaveis:
                    - u1
                    - u2
                clientes:
                  total: 28
                  porStatus:
                    Prospect: 16
                    Ativo: 9
                    Inativo: 3
                oportunidades:
                  total: 41
                  valorEmNegociacao: 1581000
                  valorGanho: 629000
                  ganhas: 11
                  perdidas: 6
                  porEtapa:
                    - etapa: Prospecção
                      quantidade: 5
                      valorTotal: 264000
                    - etapa: Contato
                      quantidade: 12
                      valorTotal: 769000
                  motivosPerda:
                    Sem verba: 2
                    Sem resposta: 2
                    Concorrente: 2
                tarefas:
                  total: 14
                  pendentes: 13
                  concluidas: 1
                  vencidas: 3
                  hoje: 2
                  amanha: 3
                  proximos15Dias: 5
                ranking:
                  - usuarioId: u2
                    nome: Pedro Dias
                    perfil: Vendedor
                    ativo: true
                    valorGanho: 235000
                    oportunidadesGanhas: 5
                  - usuarioId: u4
                    nome: Bia Melo
                    perfil: Vendedor
                    ativo: false
                    valorGanho: 210000
                    oportunidadesGanhas: 3

  /clientes:
    get:
      tags: [Clientes]
      summary: Lista de clientes com busca, filtros e paginação
      operationId: listarClientes
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
        - name: q
          in: query
          description: Busca por nome, empresa ou e-mail
          schema: { type: string, example: acme }
        - name: status
          in: query
          schema: { type: string, enum: [Todos, Prospect, Ativo, Inativo] }
        - name: responsavelId
          in: query
          schema: { type: string, example: u2 }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Página de clientes (20 por página)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaClientes" }
              example:
                itens:
                  - id: c2
                    nome: Camila Prado
                    empresa: Beta Corp
                    email: camila@betacorp.com.br
                    telefone: (36) 97515-4598
                    status: Prospect
                    responsavelId: u5
                    excluido: false
                    responsavelNome: Larissa Ferraz
                    semResponsavelAtivo: false
                  - id: c12
                    nome: Carla Alves
                    empresa: Cedro Alimentos
                    email: carla@cedroalime.com.br
                    telefone: (42) 99416-7369
                    status: Prospect
                    responsavelId: u5
                    excluido: false
                    responsavelNome: Larissa Ferraz
                    semResponsavelAtivo: false
                paginacao:
                  pagina: 1
                  porPagina: 20
                  total: 28
                  totalPaginas: 2
                filtros:
                  q: ""
                  status: Todos
                  responsavelId: Todos
                escopo:
                  usuarioId: u1
                  perfil: Gerente
                  responsaveis:
                    - u1
                    - u2
    post:
      tags: [Clientes]
      summary: Cadastra cliente (nasce como Prospect)
      operationId: criarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteEntrada" }
      responses:
        "201":
          description: Cliente validado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
              example:
                id: c_q5oaqn
                nome: Marina Duarte
                empresa: Acme Logística
                email: marina@acmelog.com.br
                telefone: (11) 98888-1234
                status: Prospect
                responsavelId: u2
                excluido: false
                responsavelNome: Pedro Dias
                semResponsavelAtivo: false
        "400":
          $ref: "#/components/responses/ErroValidacao"

  /clientes/{id}:
    parameters:
      - $ref: "#/components/parameters/ClienteIdPath"
    get:
      tags: [Clientes]
      summary: Cliente com interações, oportunidades e tarefas
      operationId: detalharCliente
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Detalhe do cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaClienteDetalhe" }
              example:
                cliente:
                  id: c2
                  nome: Camila Prado
                  empresa: Beta Corp
                  email: camila@betacorp.com.br
                  telefone: (36) 97515-4598
                  status: Prospect
                  responsavelId: u5
                  excluido: false
                  responsavelNome: Larissa Ferraz
                  semResponsavelAtivo: false
                interacoes:
                  - id: i_770uem
                    clienteId: c2
                    tipo: Ligação
                    icon: phone
                    cor: signal
                    obs: Cliente relatou dificuldade no uso do produto, encaminhado ao suporte.
                    autorId: u5
                    data: 2026-08-23
                  - id: i_8e8azh
                    clienteId: c2
                    tipo: Reunião
                    icon: meeting
                    cor: amber
                    obs: Demo do produto com equipe técnica.
                    autorId: u5
                    data: 2026-08-15
                oportunidades:
                  - id: o_fvo895
                    clienteId: c2
                    titulo: Expansão de equipe
                    etapa: Proposta
                    resultado: null
                    motivoPerda: null
                    valor: 59000
                    responsavelId: u5
                    dataPrevista: 2026-10-31
                    atualizada: 2026-08-15
                  - id: o_7w0735
                    clienteId: c2
                    titulo: Plano mensal
                    etapa: Fechado
                    resultado: perdido
                    motivoPerda: Sem verba
                    valor: 63000
                    responsavelId: u5
                    dataPrevista: 2026-09-19
                    atualizada: 2026-08-06
                tarefas: []
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    patch:
      tags: [Clientes]
      summary: Altera campos do cliente
      operationId: atualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClienteEntradaParcial" }
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
              example:
                id: c2
                nome: Camila Prado
                empresa: Beta Corp
                email: camila@betacorp.com.br
                telefone: (36) 97515-4598
                status: Ativo
                responsavelId: u5
                excluido: false
                responsavelNome: Larissa Ferraz
                semResponsavelAtivo: false
        "400":
          $ref: "#/components/responses/ErroValidacao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Clientes]
      summary: Exclusão lógica (passa a Inativo e sai das listagens)
      operationId: excluirCliente
      responses:
        "200":
          description: Cliente marcado como excluído
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
              example:
                id: c2
                nome: Camila Prado
                empresa: Beta Corp
                email: camila@betacorp.com.br
                telefone: (36) 97515-4598
                status: Inativo
                responsavelId: u5
                excluido: true
                responsavelNome: Larissa Ferraz
                semResponsavelAtivo: false
                mensagem: "Exclusão lógica aplicada: o cliente sai das listagens e o histórico é preservado."
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /clientes/{id}/interacoes:
    post:
      tags: [Interações]
      summary: Registra ligação, e-mail ou reunião
      operationId: criarInteracao
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, obs]
              properties:
                tipo: { type: string, enum: [Ligação, E-mail, Reunião] }
                obs:
                  type: string
                  minLength: 3
                  example: Cliente pediu proposta revisada até sexta.
                usuarioId: { type: string, example: u1 }
      responses:
        "201":
          description: Interação validada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interacao" }
              example:
                id: i_w4fx2u
                clienteId: c2
                tipo: Ligação
                icon: phone
                cor: signal
                obs: Cliente pediu proposta revisada até sexta.
                data: 2026-08-31
                autorId: u2
        "400":
          $ref: "#/components/responses/ErroValidacao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /oportunidades:
    get:
      tags: [Oportunidades]
      summary: Funil agrupado nas quatro etapas, com contagem e soma
      operationId: listarOportunidades
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Funil no escopo do usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaFunil" }
              example:
                etapas:
                  - etapa: Prospecção
                    quantidade: 5
                    valorTotal: 264000
                    ganhas: 0
                    perdidas: 0
                    itens:
                      - id: o_agbky
                        clienteId: c6
                        titulo: Plano mensal
                        etapa: Prospecção
                        resultado: null
                        motivoPerda: null
                        valor: 96000
                        responsavelId: u2
                        dataPrevista: 2026-09-17
                        atualizada: 2026-08-17
                        clienteNome: Karina Lacerda
                        clienteEmpresa: Sigma Ltda
                        responsavelNome: Pedro Dias
                        semResponsavelAtivo: false
                      - id: o_6dkwm8
                        clienteId: c22
                        titulo: Plano mensal
                        etapa: Prospecção
                        resultado: null
                        motivoPerda: null
                        valor: 75000
                        responsavelId: u5
                        dataPrevista: 2026-09-15
                        atualizada: 2026-08-27
                        clienteNome: William Teixeira
                        clienteEmpresa: Amêndoa Studio
                        responsavelNome: Larissa Ferraz
                        semResponsavelAtivo: false
                  - etapa: Contato
                    quantidade: 12
                    valorTotal: 769000
                    ganhas: 0
                    perdidas: 0
                    itens:
                      - id: o_bmghnl
                        clienteId: c16
                        titulo: Módulo extra
                        etapa: Contato
                        resultado: null
                        motivoPerda: null
                        valor: 113000
                        responsavelId: u2
                        dataPrevista: 2026-09-29
                        atualizada: 2026-08-05
                        clienteNome: Pedro Moraes
                        clienteEmpresa: Prisma Educação
                        responsavelNome: Pedro Dias
                        semResponsavelAtivo: false
                      - id: o_agehdd
                        clienteId: c33
                        titulo: Licenças adicionais
                        etapa: Contato
                        resultado: null
                        motivoPerda: null
                        valor: 108000
                        responsavelId: u4
                        dataPrevista: 2026-11-03
                        atualizada: 2026-08-03
                        clienteNome: Vanessa Rocha
                        clienteEmpresa: Nortex Sistemas
                        responsavelNome: Bia Melo
                        semResponsavelAtivo: true
                total: 41
                valorEmNegociacao: 1581000
                escopo:
                  usuarioId: u1
                  perfil: Gerente
    post:
      tags: [Oportunidades]
      summary: Cria oportunidade vinculada a um cliente
      operationId: criarOportunidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, titulo, valor]
              properties:
                clienteId: { type: string, example: c19 }
                titulo: { type: string, minLength: 3, example: Renovação anual }
                valor: { type: number, minimum: 0, example: 120000 }
                etapa: { $ref: "#/components/schemas/Etapa" }
                dataPrevista: { type: string, format: date, example: "2026-10-24" }
                usuarioId: { type: string, example: u1 }
      responses:
        "201":
          description: Oportunidade validada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Oportunidade" }
              example:
                id: o_rl1hh6
                clienteId: c2
                titulo: Renovação de contrato
                etapa: Prospecção
                resultado: null
                motivoPerda: null
                valor: 48000
                dataPrevista: 2026-10-15
                atualizada: 2026-08-31
                responsavelId: u2
                clienteNome: Camila Prado
                clienteEmpresa: Beta Corp
                responsavelNome: Pedro Dias
                semResponsavelAtivo: false
        "400":
          $ref: "#/components/responses/ErroValidacao"

  /oportunidades/{id}:
    patch:
      tags: [Oportunidades]
      summary: Move no funil, fecha ou reabre
      description: |
        RF09: sair da etapa `Fechado` exige `reabrir: true`.
        RF29: fechar com `resultado: perdido` exige `motivoPerda`.
      operationId: moverOportunidade
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: o_dk77pt }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etapa]
              properties:
                etapa: { $ref: "#/components/schemas/Etapa" }
                resultado:
                  type: string
                  nullable: true
                  enum: [ganho, perdido, null]
                motivoPerda: { $ref: "#/components/schemas/MotivoPerda" }
                reabrir:
                  type: boolean
                  description: Obrigatório para tirar a oportunidade de "Fechado"
                usuarioId: { type: string, example: u1 }
            examples:
              avancar:
                summary: Avança para Proposta
                value: { etapa: Proposta }
              perder:
                summary: Fecha como perdida (RF29)
                value: { etapa: Fechado, resultado: perdido, motivoPerda: Preço }
              reabrir:
                summary: Reabre uma oportunidade fechada (RF09)
                value: { etapa: Contato, reabrir: true }
      responses:
        "200":
          description: Oportunidade movida, com o funil recalculado
          content:
            application/json:
              example:
                oportunidade:
                  id: o_agbky
                  clienteId: c6
                  titulo: Plano mensal
                  etapa: Proposta
                  resultado: null
                  motivoPerda: null
                  valor: 96000
                  responsavelId: u2
                  dataPrevista: 2026-09-17
                  atualizada: 2026-08-31
                  clienteNome: Karina Lacerda
                  clienteEmpresa: Sigma Ltda
                  responsavelNome: Pedro Dias
                  semResponsavelAtivo: false
                clienteStatus: null
                reaberta: false
              schema:
                type: object
                properties:
                  oportunidade: { $ref: "#/components/schemas/Oportunidade" }
                  etapas:
                    type: array
                    items: { $ref: "#/components/schemas/EtapaFunil" }
        "400":
          $ref: "#/components/responses/ErroValidacao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /tarefas:
    get:
      tags: [Tarefas]
      summary: Tarefas com faixa de vencimento calculada
      operationId: listarTarefas
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
        - name: status
          in: query
          schema: { type: string, enum: [pendente, concluida] }
      responses:
        "200":
          description: Tarefas no escopo do usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTarefas" }
              example:
                itens:
                  - id: t_4dtnzk
                    titulo: Enviar proposta de renovação
                    clienteId: c12
                    vinculoTipo: cliente
                    vinculoLabel: Cedro Alimentos
                    vinculoOppId: null
                    responsavelId: u5
                    status: concluida
                    vencimento: 2026-08-25
                    faixa: null
                    clienteNome: Carla Alves
                  - id: t_g5sitz
                    titulo: Preparar apresentação
                    clienteId: c16
                    vinculoTipo: oportunidade
                    vinculoLabel: Módulo extra
                    vinculoOppId: o_bmghnl
                    responsavelId: u2
                    status: pendente
                    vencimento: 2026-08-26
                    faixa: vencida
                    clienteNome: Pedro Moraes
                total: 14
                resumo:
                  pendentes: 13
                  concluidas: 1
                  vencidas: 3
                  hoje: 2
                  amanha: 3
                  proximos15Dias: 5

  /tarefas/{id}:
    patch:
      tags: [Tarefas]
      summary: Conclui ou reabre a tarefa
      operationId: atualizarTarefa
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: t_4dtnzk }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pendente, concluida] }
      responses:
        "200":
          description: Tarefa atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tarefa" }
              example:
                id: t_4dtnzk
                titulo: Enviar proposta de renovação
                clienteId: c12
                vinculoTipo: cliente
                vinculoLabel: Cedro Alimentos
                vinculoOppId: null
                responsavelId: u5
                status: concluida
                vencimento: 2026-08-25
                faixa: null
        "400":
          $ref: "#/components/responses/ErroValidacao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

components:
  parameters:
    UsuarioId:
      name: usuarioId
      in: query
      description: Define o escopo dos dados (RF15). Ausente, assume o Administrador.
      schema: { type: string, example: u1 }
    ClienteIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, example: c19 }

  responses:
    ErroValidacao:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            erro: Cliente inválido
            erros:
              - "nome: informe ao menos 3 caracteres"
              - "email: formato inválido"
    NaoEncontrado:
      description: Registro inexistente ou fora do escopo do usuário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: { erro: Cliente não encontrado }

  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string }
        erros:
          type: array
          items: { type: string }

    Perfil:
      type: string
      enum: [Admin, Gerente, Vendedor]
    StatusCliente:
      type: string
      enum: [Prospect, Ativo, Inativo]
    Etapa:
      type: string
      enum: [Prospecção, Contato, Proposta, Fechado]
    MotivoPerda:
      type: string
      nullable: true
      enum: [Preço, Concorrente, Sem verba, Sem resposta, null]
    FaixaVencimento:
      type: string
      nullable: true
      enum: [vencida, hoje, amanha, quinze, null]

    Usuario:
      type: object
      properties:
        id: { type: string, example: u1 }
        nome: { type: string, example: Ana Costa }
        email: { type: string, format: email, example: ana@empresa.com }
        perfil: { $ref: "#/components/schemas/Perfil" }
        status: { type: string, enum: [Ativo, Desativado] }
        gerenteId: { type: string, nullable: true }
        modoVisualizacao: { type: string, enum: [Total, Equipe, Individual] }
        seed: { type: boolean }

    Cliente:
      type: object
      properties:
        id: { type: string, example: c19 }
        nome: { type: string, example: Ana Zanetti }
        empresa: { type: string, example: Bluepine Consultoria }
        email: { type: string, format: email, example: ana@bluepineco.com.br }
        telefone: { type: string, example: "(24) 93545-7557" }
        status: { $ref: "#/components/schemas/StatusCliente" }
        responsavelId: { type: string, example: u7 }
        excluido: { type: boolean, example: false }
        responsavelNome: { type: string, example: Ana Costa }
        semResponsavelAtivo:
          type: boolean
          description: RF33, responsável desativado; o registro fica visível e sinalizado

    ClienteEntrada:
      type: object
      required: [nome, empresa, email, telefone, responsavelId]
      properties:
        nome: { type: string, minLength: 3, example: Cliente Teste }
